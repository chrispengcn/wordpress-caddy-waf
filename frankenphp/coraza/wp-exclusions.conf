# ============================================================
# WordPress WAF 排除规则
# 防止 WAF 误拦截 WordPress 正常操作
# ============================================================

# 告知 CRS WordPress 排除规则已激活
SecAction \
    "id:9002000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.wordpress-rule-exclusions=1"

# 加载官方 WordPress 排除规则
Include /etc/caddy/wp-exclusions/plugins/wordpress-rule-exclusions-before.conf

# -----------------------------------------------------------------------------
# 额外的 WordPress 特定排除
# -----------------------------------------------------------------------------

# WordPress 后台 AJAX - 允许 admin-ajax.php 的 POST 请求
SecRule REQUEST_FILENAME "@endsWith /wp-admin/admin-ajax.php" \
    "id:9002001,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    ctl:ruleEngine=DetectionOnly"

# WordPress REST API - 允许正常 API 调用
SecRule REQUEST_FILENAME "@contains /wp-json/" \
    "id:9002002,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    ctl:ruleEngine=DetectionOnly"

# WordPress Cron
SecRule REQUEST_FILENAME "@endsWith /wp-cron.php" \
    "id:9002003,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    ctl:ruleEngine=DetectionOnly"

# XML-RPC (如果需要的话，建议关闭)
# SecRule REQUEST_FILENAME "@endsWith /xmlrpc.php" \
#     "id:9002004,\
#     phase:1,\
#     nolog,\
#     pass,\
#     t:none,\
#     ctl:ruleEngine=DetectionOnly"

# -----------------------------------------------------------------------------
# 插件和主题编辑器排除
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@endsWith /wp-admin/plugin-editor.php" \
    "id:9002010,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    ctl:ruleEngine=DetectionOnly"

SecRule REQUEST_FILENAME "@endsWith /wp-admin/theme-editor.php" \
    "id:9002011,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    ctl:ruleEngine=DetectionOnly"

# -----------------------------------------------------------------------------
# 文件上传排除 (允许 WordPress 媒体库上传)
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@endsWith /wp-admin/async-upload.php" \
    "id:9002020,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    ctl:ruleEngine=DetectionOnly"
