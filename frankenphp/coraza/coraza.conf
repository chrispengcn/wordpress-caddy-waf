# ============================================================
# Coraza WAF 基础配置
# 与 ModSecurity 指令 100% 兼容
# ============================================================

# -----------------------------------------------------------------------------
# WAF 运行模式
#   On           = 启用拦截模式 - 恶意请求返回 403
#   DetectionOnly = 仅检测不拦截 - 日志记录所有命中
#   Off          = 完全关闭
# 上线初期建议先用 DetectionOnly 观察日志，确认无误后改为 On
# -----------------------------------------------------------------------------
SecRuleEngine On

# -----------------------------------------------------------------------------
# 请求体处理
# -----------------------------------------------------------------------------
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# -----------------------------------------------------------------------------
# 响应体处理 (默认关闭，仅检测时可开启)
# -----------------------------------------------------------------------------
SecResponseBodyAccess Off
SecResponseBodyMimeType text/plain text/html text/xml
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# -----------------------------------------------------------------------------
# 临时目录
# -----------------------------------------------------------------------------
SecTmpDir /tmp/
SecDataDir /tmp/

# -----------------------------------------------------------------------------
# 审计日志配置
# -----------------------------------------------------------------------------
# RelevantOnly = 只记录被拦截或告警的请求
# 日志输出到 stdout，可通过 docker logs 查看
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5[0-9]{2}|4(?:0[0-35-9]|[1-9][0-9]))$"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /dev/stdout

# -----------------------------------------------------------------------------
# 参数解析
# -----------------------------------------------------------------------------
SecArgumentSeparator &
SecCookieFormat 0

# -----------------------------------------------------------------------------
# 备注:
#   - 不要在这里定义 SecDefaultAction - 由 CRS 的 crs-setup.conf 管理
#   - Coraza 使用 Go RE2 正则引擎，不支持 Perl 前瞻/后顾语法
#   - 不支持 SecUnicodeMapFile 指令
# -----------------------------------------------------------------------------
